# Svitgrid HA Preset — Deye String (3-phase grid-tie, no battery).
#
# Solarman HACS profile: deye_string.yaml.
# No battery → no set_battery_charge / set_grid_charge_toggle commands.
# Grid-tie inverters always sell; no work_mode toggle is meaningful here.

# v2 (2026-08-18): added per-string PV voltage/current.
#   The app's per-string "V / A" subline was blank on EVERY HA household —
#   no per-string voltage/current field was mappable until now.

id: deye-string-solarman-v1
version: "2"
brand: Deye
model: String (3-phase grid-tie)
phases: 3
hasBattery: false
pvStrings: 2
protocolId: home_assistant_solarman

entityMap:
  pv1Power: sensor.inverter_pv1_power
  pv2Power: sensor.inverter_pv2_power
  # Per-string voltage/current (Solarman profile: "PV1 Voltage" /
  # "PV1 Current" sit alongside the "PV1 Power" sensor mapped above).
  # Feeds the app's per-string "V / A" subline on the solar detail card.
  pv1Voltage: sensor.inverter_pv1_voltage
  pv1Current: sensor.inverter_pv1_current
  pv2Voltage: sensor.inverter_pv2_voltage
  pv2Current: sensor.inverter_pv2_current
  gridPower: sensor.inverter_grid_power
  loadPower: sensor.inverter_load_power
  dailyPvEnergy: sensor.inverter_today_production
  gridVoltageL1: sensor.inverter_grid_l1_voltage
  gridVoltageL2: sensor.inverter_grid_l2_voltage
  gridVoltageL3: sensor.inverter_grid_l3_voltage

commands: []
