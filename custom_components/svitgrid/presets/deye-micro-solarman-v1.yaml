# Svitgrid HA Preset — Deye Microinverter (1-phase, multi-PV, no battery).
#
# Solarman HACS profile: deye_micro.yaml. Microinverters report per-channel
# PV (up to 4 strings); no battery; the grid-tie aggregate goes through
# the sensor.inverter_total_production family.
#
# No commands — microinverters don't expose write registers for SOC or
# work-mode control.

# v2 (2026-08-18): added per-string PV voltage/current.
#   The app's per-string "V / A" subline was blank on EVERY HA household —
#   no per-string voltage/current field was mappable until now.

id: deye-micro-solarman-v1
version: "2"
brand: Deye
model: Microinverter
phases: 1
hasBattery: false
pvStrings: 4
protocolId: home_assistant_solarman

entityMap:
  pv1Power: sensor.inverter_pv1_power
  pv2Power: sensor.inverter_pv2_power
  pv3Power: sensor.inverter_pv3_power
  pv4Power: sensor.inverter_pv4_power
  # Per-string voltage/current (Solarman profile: "PV1 Voltage" /
  # "PV1 Current" sit alongside the "PV1 Power" sensor mapped above).
  # Feeds the app's per-string "V / A" subline on the solar detail card.
  pv1Voltage: sensor.inverter_pv1_voltage
  pv1Current: sensor.inverter_pv1_current
  pv2Voltage: sensor.inverter_pv2_voltage
  pv2Current: sensor.inverter_pv2_current
  pv3Voltage: sensor.inverter_pv3_voltage
  pv3Current: sensor.inverter_pv3_current
  pv4Voltage: sensor.inverter_pv4_voltage
  pv4Current: sensor.inverter_pv4_current
  dailyPvEnergy: sensor.inverter_today_production
  gridVoltageL1: sensor.inverter_grid_voltage

commands: []
